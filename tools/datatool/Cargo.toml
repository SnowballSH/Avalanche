[package]
name = "datatool"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
viriformat = "2.0.1"

# viriformat's debug-only validity checks panic on malformed input; the validator must behave as in release.
[profile.dev.package.viriformat]
debug-assertions = false
