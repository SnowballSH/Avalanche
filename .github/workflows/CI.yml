# CI for Avalanche.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1" # weekly regression guard against master (Monday)

# Cancel superseded runs on the same branch (e.g. rapid PR pushes).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ZIG_VERSION: "0.16.0"

jobs:
  build:
    name: build / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Zig ${{ env.ZIG_VERSION }}
        # mlugg/setup-zig@v2 is the maintained successor to goto-bus-stop/setup-zig:
        # it knows the 0.16.0 release channel and current ziglang.org download
        # layout, verifies the release minisign signature, and caches the global
        # zig cache (~/.cache/zig) keyed on build.zig[.zon] across runs.
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Zig version / env
        run: |
          zig version
          zig env

      - name: Debug build
        run: zig build

      - name: Release build
        run: zig build --release=fast

      - name: Unit tests
        run: zig build test

      # The release build above leaves the binary at zig-out/bin/Avalanche[.exe].
      # The expected node count is NOT hardcoded here -- it is read from the
      # committed `bench.nodes` file. Whenever a change legitimately alters the
      # node count, run `scripts/update_bench.sh` and commit the updated file.
      - name: Bench (assert node count)
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then BIN="./zig-out/bin/Avalanche.exe"; else BIN="./zig-out/bin/Avalanche"; fi
          EXPECTED="$(tr -d '[:space:]' < bench.nodes)"
          echo "Expected node count (from bench.nodes): $EXPECTED"
          OUT="$("$BIN" bench)"
          echo "$OUT"
          # bench prints "<nodes> nodes <nps> nps"; the node count is speed-independent.
          if echo "$OUT" | grep -qE "^${EXPECTED} nodes"; then
            echo "OK: bench node count matches ($EXPECTED nodes)"
          else
            echo "FAIL: expected '$EXPECTED nodes' (from bench.nodes), but bench printed the line above."
            echo "      If this change intentionally alters the node count, run scripts/update_bench.sh and commit bench.nodes."
            exit 1
          fi

      - name: UCI frontend smoke test
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then BIN="./zig-out/bin/Avalanche.exe"; else BIN="./zig-out/bin/Avalanche"; fi
          # Mock a user driving the UCI frontend, then quit. The engine spawns the
          # search on a detached thread, so "bestmove" prints asynchronously after
          # "go"; pad with a sleep before "quit" so it can flush before stdin closes.
          OUT="$(
            {
              printf 'uci\n'
              printf 'isready\n'
              printf 'position startpos moves e2e4 e7e5\n'
              printf 'go depth 8\n'
              sleep 3
              printf 'quit\n'
            } | "$BIN"
          )"
          echo "----- engine output -----"
          echo "$OUT"
          echo "-------------------------"
          fail=0
          echo "$OUT" | grep -q "uciok"     || { echo "FAIL: missing 'uciok'";    fail=1; }
          echo "$OUT" | grep -q "readyok"   || { echo "FAIL: missing 'readyok'";  fail=1; }
          echo "$OUT" | grep -q "^bestmove" || { echo "FAIL: missing 'bestmove' line"; fail=1; }
          [ "$fail" -eq 0 ] || exit 1
          echo "OK: UCI smoke test passed (uciok / readyok / bestmove)"

  # Cross-compile optimized release binaries for the standard platforms and
  # upload them. Runs only after the matrix passes, on push-to-master and manual
  # dispatch -- never on pull requests (so forks cannot trigger artifact builds).
  artifacts:
    name: release artifacts
    needs: build
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Zig ${{ env.ZIG_VERSION }}
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Cross-compile release binaries
        run: bash build_all_v3.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Avalanche-${{ github.sha }}
          # Ship the runnable binaries only; drop the Windows .pdb debug symbols.
          path: |
            artifacts/bin/*
            !artifacts/bin/*.pdb
          if-no-files-found: error
          retention-days: 30
