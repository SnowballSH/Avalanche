# CI for Avalanche.

name: CI

# Tests run on master, on pull requests into it, and weekly. Feature branches
# are tested through their pull request instead of on every push.
on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1" # weekly regression guard against master (Monday)

# Cancel superseded runs on the same branch (e.g. rapid PR pushes).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ZIG_VERSION: "0.17.0"

jobs:
  build:
    name: build / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Zig ${{ env.ZIG_VERSION }}
        # mlugg/setup-zig@v2 is the maintained successor to goto-bus-stop/setup-zig:
        # it knows the current release channel and ziglang.org download
        # layout, verifies the release minisign signature, and caches the global
        # zig cache (~/.cache/zig), which holds the maker executable, across runs.
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Zig version / env
        run: |
          zig version
          zig env

      # Unit tests do not compile the UCI frontend; one Debug build covers it.
      - name: Debug build
        if: runner.os == 'Linux'
        run: zig build

      - name: Release build
        run: zig build --release=fast

      - name: OpenBench build contract
        if: runner.os == 'Linux'
        run: scripts/openbench_build_check.sh

      - name: Unit tests
        run: zig build test

      - name: Unit tests (fast)
        run: zig build test -Doptimize=fast

      # The default network is multi-layer; this covers the single-layer head.
      - name: Unit tests (single-layer head)
        if: runner.os == 'Linux'
        run: zig build test -Dnet=nets/dianguang-1.nnue

      # The release build above leaves the binary at zig-out/bin/Avalanche[.exe].
      # The expected node count and checksum are NOT hardcoded here -- they are
      # read from the committed `bench.nodes` and `nnue-speed.checksum` files.
      # Whenever a change legitimately alters either, run
      # `scripts/update_bench.sh` and commit the updated files.
      - name: Bench node count and nnue-speed checksum
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then BIN="./zig-out/bin/Avalanche.exe"; else BIN="./zig-out/bin/Avalanche"; fi
          bash scripts/verify_binary.sh "$BIN"

      - name: UCI frontend smoke test
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then BIN="./zig-out/bin/Avalanche.exe"; else BIN="./zig-out/bin/Avalanche"; fi
          # Mock a user driving the UCI frontend, then quit. The engine spawns the
          # search on a detached thread, so "bestmove" prints asynchronously after
          # "go"; pad with a sleep before "quit" so it can flush before stdin closes.
          OUT="$(
            {
              printf 'uci\n'
              printf 'isready\n'
              printf 'position startpos moves e2e4 e7e5\n'
              printf 'go depth 8\n'
              sleep 3
              printf 'quit\n'
            } | "$BIN"
          )"
          echo "----- engine output -----"
          echo "$OUT"
          echo "-------------------------"
          fail=0
          echo "$OUT" | grep -q "uciok"     || { echo "FAIL: missing 'uciok'";    fail=1; }
          echo "$OUT" | grep -q "readyok"   || { echo "FAIL: missing 'readyok'";  fail=1; }
          echo "$OUT" | grep -q "^bestmove" || { echo "FAIL: missing 'bestmove' line"; fail=1; }
          [ "$fail" -eq 0 ] || exit 1
          echo "OK: UCI smoke test passed (uciok / readyok / bestmove)"

      - name: UCI protocol tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then BIN="./zig-out/bin/Avalanche.exe"; else BIN="./zig-out/bin/Avalanche"; fi
          python3 scripts/uci_protocol_test.py "$BIN"

  # Release binaries for CPU levels other than the runner's own (docs/BUILD.md, "Release matrix"):
  # each is built, checked for the SIMD paths and instructions of its level and, where the
  # runner's CPU has them, run. A pull request builds four of them and one native binary; the
  # whole matrix is built by the `artifacts` job for tags.
  tiers:
    name: tiers / ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-latest
            must_run: x86_64-linux-v2
            may_run: x86_64-linux-avx512
          - arch: aarch64
            os: ubuntu-24.04-arm
            must_run: aarch64-linux aarch64-linux-dotprod
            may_run: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # A fixed version keeps build_options, and with it the compilation cache, the same between runs.
      VERSION: ci
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Zig ${{ env.ZIG_VERSION }}
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install llvm-objdump
        run: sudo apt-get update && sudo apt-get install -y llvm

      - name: CPU features of this runner
        run: grep -m1 -E '^(flags|Features)' /proc/cpuinfo

      - name: Binaries every runner of this architecture can run
        run: REQUIRE_RUN=1 bash build_all_v3.sh ${{ matrix.must_run }}

      - name: Binaries that run where the CPU allows
        if: matrix.may_run != ''
        run: bash build_all_v3.sh ${{ matrix.may_run }}

      # No development machine has SVE, so an SVE-enabled build is executed here or nowhere.
      - name: Native build on an SVE CPU
        if: matrix.arch == 'aarch64'
        run: |
          if grep -q -w sve /proc/cpuinfo; then
            zig build --release=fast -Dversion="$VERSION"
            bash scripts/verify_binary.sh zig-out/bin/Avalanche "128-bit vectors, pairwise umull, L1 sdot, L2 wide"
          else
            echo "::notice::this runner has no SVE: the SVE-enabled native build was not executed"
          fi

  datatool:
    name: datatool
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tools/datatool
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test

  wasm:
    name: wasm / node
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Zig ${{ env.ZIG_VERSION }}
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Type check and lint
        working-directory: web
        run: |
          npm run check
          npm run lint

      - name: Web tests (builds wasm and native release)
        working-directory: web
        run: npm test

      - name: UCI protocol tests on wasm
        run: python3 scripts/uci_protocol_test.py node web/src/node/cli.ts zig-out/web/avalanche.wasm

  # Cross-compile release binaries (native + wasm) and upload them. This is the
  # slowest job, so it runs only for version tags (v*) and manual dispatch, never
  # per commit or on pull requests (so forks cannot trigger artifact builds).
  artifacts:
    name: release artifacts
    needs: [build, tiers, wasm]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Zig ${{ env.ZIG_VERSION }}
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install llvm-objdump
        run: sudo apt-get update && sudo apt-get install -y llvm

      - name: Cross-compile release binaries
        env:
          # Tag builds report the tag's version (v4.1.0 -> 4.1.0); manual runs are dev builds.
          VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'dev' }}
        run: bash build_all_v3.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Avalanche-${{ github.sha }}
          # Ship the runnable binaries only; drop the Windows .pdb debug symbols.
          path: |
            artifacts/bin/*
            !artifacts/bin/*.pdb
          if-no-files-found: error
          retention-days: 30
