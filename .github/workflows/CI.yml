name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ZIG_VERSION: "0.17.0"
  RUFF_VERSION: "0.17.0"

jobs:
  build:
    name: build / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Zig ${{ env.ZIG_VERSION }}
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Zig version / env
        run: |
          zig version
          zig env

      - name: Format
        if: runner.os == 'Linux'
        run: zig fmt --check src build.zig

      - name: Debug build
        if: runner.os == 'Linux'
        run: zig build

      - name: Release build
        run: zig build --release=fast

      - name: OpenBench build contract
        if: runner.os == 'Linux'
        run: scripts/openbench_build_check.sh

      - name: Unit tests
        run: zig build test

      - name: Unit tests (fast)
        run: zig build test -Doptimize=fast

      - name: Unit tests (safe)
        if: runner.os == 'Linux'
        run: zig build test -Doptimize=safe

      - name: Unit tests (single-layer head)
        if: runner.os == 'Linux'
        run: zig build test -Dnet=nets/nezha.nnue

      - name: Bench node count and nnue-speed checksum
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then BIN="./zig-out/bin/Avalanche.exe"; else BIN="./zig-out/bin/Avalanche"; fi
          bash scripts/verify_binary.sh "$BIN"

      - name: UCI protocol tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then BIN="./zig-out/bin/Avalanche.exe"; else BIN="./zig-out/bin/Avalanche"; fi
          python3 scripts/uci_protocol_test.py "$BIN"

  tiers:
    name: tiers / ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-latest
            must_run: x86_64-linux-v2
            may_run: x86_64-linux-avx512
          - arch: aarch64
            os: ubuntu-24.04-arm
            must_run: aarch64-linux aarch64-linux-dotprod
            may_run: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      VERSION: ci
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Zig ${{ env.ZIG_VERSION }}
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install llvm-objdump
        run: sudo apt-get update && sudo apt-get install -y llvm

      - name: CPU features of this runner
        run: grep -m1 -E '^(flags|Features)' /proc/cpuinfo

      - name: Binaries every runner of this architecture can run
        run: REQUIRE_RUN=1 scripts/build_release.sh ${{ matrix.must_run }}

      - name: Binaries that run where the CPU allows
        if: matrix.may_run != ''
        run: scripts/build_release.sh ${{ matrix.may_run }}

      - name: Native build on an SVE CPU
        if: matrix.arch == 'aarch64'
        run: |
          if grep -q -w sve /proc/cpuinfo; then
            zig build --release=fast -Dversion="$VERSION"
            bash scripts/verify_binary.sh zig-out/bin/Avalanche "128-bit vectors, pairwise umull, L1 sdot, L2 wide"
          else
            echo "::notice::this runner has no SVE: the SVE-enabled native build was not executed"
          fi

  datatool:
    name: datatool
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tools/datatool
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked

  trainer:
    name: trainer
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: training
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --locked --no-default-features --all-targets -- -D warnings
      - name: Lint with the CUDA backend
        run: CUDA_PATH="$RUNNER_TEMP" cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --no-default-features

  scripts:
    name: scripts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Shell lint
        run: git ls-files -z '*.sh' | xargs -0 shellcheck -x

      - name: Install ruff ${{ env.RUFF_VERSION }} and numpy
        run: |
          python3 -m venv "$RUNNER_TEMP/python"
          "$RUNNER_TEMP/python/bin/pip" install "ruff==$RUFF_VERSION" numpy
          echo "$RUNNER_TEMP/python/bin" >> "$GITHUB_PATH"

      - name: Python lint
        run: ruff check scripts

      - name: Python format
        run: ruff format --check scripts

      - name: Python tests
        run: python3 -m unittest discover -s scripts

  wasm:
    name: wasm / node
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Zig ${{ env.ZIG_VERSION }}
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Type check and lint
        working-directory: web
        run: |
          npm run check
          npm run lint

      - name: Web tests (builds wasm and native release)
        working-directory: web
        run: npm test

      - name: UCI protocol tests on wasm
        run: python3 scripts/uci_protocol_test.py node web/src/node/cli.ts zig-out/web/avalanche.wasm

  tcec:
    name: tcec install script
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lint
        run: shellcheck -x tcec/update.sh tcec/install.sh

      - name: Zig toolchain of an earlier run
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/tcec/Avalanche/zig-*-linux-*
          key: tcec-zig-${{ hashFiles('build.zig.zon') }}

      # install.sh builds origin's master: here origin is this checkout and master is the commit under test.
      - name: Install from this commit
        run: |
          git update-ref refs/heads/master HEAD
          mkdir -p "$RUNNER_TEMP/tcec" && cd "$RUNNER_TEMP/tcec"
          git init --quiet Avalanche
          git -C Avalanche remote add origin "file://$GITHUB_WORKSPACE"
          source "$GITHUB_WORKSPACE/tcec/install.sh"
          case $GITHUB_REF in
            refs/tags/v*) expected=${GITHUB_REF_NAME#v} ;;
            *) expected=$(sed -n 's/^ *\.version = "\(.*\)",$/\1/p' "$GITHUB_WORKSPACE/build.zig.zon")-dev-${GITHUB_SHA:0:8} ;;
          esac
          printf 'uci\nquit\n' | "$EXE" | grep -F -x "id name Avalanche $expected"

      - name: A failed update leaves EXE unset
        run: |
          cd "$(mktemp -d)"
          git init --quiet Avalanche
          git -C Avalanche remote add origin file:///nonexistent
          EXE=stale
          set +e
          source "$GITHUB_WORKSPACE/tcec/update.sh"
          set -e
          [ -z "${EXE+set}" ]

      - name: Update from master as TCEC does
        if: github.ref == 'refs/heads/master' && github.event_name != 'push'
        run: |
          cd "$(mktemp -d)"
          source "$GITHUB_WORKSPACE/tcec/update.sh"
          printf 'uci\nquit\n' | "$EXE" | grep -E -x "id name Avalanche [0-9]+\.[0-9]+\.[0-9]+(-dev-[0-9a-f]{8})?"

  artifacts:
    name: release artifacts
    needs: [build, tiers, wasm]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: The tag is the version of both manifests
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag=${GITHUB_REF_NAME#v}
          zon=$(sed -n 's/^ *\.version = "\(.*\)",$/\1/p' build.zig.zon)
          web=$(jq -r .version web/package.json)
          if [ "$tag" != "$zon" ] || [ "$tag" != "$web" ]; then
            echo "::error::tag $tag, build.zig.zon $zon and web/package.json $web must be one version"
            exit 1
          fi

      - name: Setup Zig ${{ env.ZIG_VERSION }}
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install llvm-objdump
        run: sudo apt-get update && sudo apt-get install -y llvm

      - name: Cross-compile release binaries
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'dev' }}
        run: scripts/build_release.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Avalanche-${{ github.sha }}
          path: |
            artifacts/bin/*
            !artifacts/bin/*.pdb
          if-no-files-found: error
          retention-days: 30
